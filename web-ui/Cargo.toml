[package]
name = "web-ui"
version = "0.1.0"
edition = "2021"
description = "Leptos CSR dashboard for rust_engine (--web mode)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
shared-types = { path = "../shared-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "EventSource",
    "MessageEvent",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "console",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
